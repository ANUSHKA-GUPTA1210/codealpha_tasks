<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <h2>ShopEase</h2>

    <ul class="nav-links">
        <li>

</li>

<section class="checkout-section">

    <h1>Checkout</h1>

    <form id="checkoutForm">

        <input
        type="text"
        id="name"
        placeholder="Full Name"
        required>

        <input
        type="email"
        id="email"
        placeholder="Email"
        required>

        <input
        type="tel"
        id="phone"
        placeholder="Phone Number"
        required>

        <textarea
        id="address"
        placeholder="Delivery Address"
        required></textarea>

        <button type="submit">
            Place Order
        </button>

    </form>

</section>

<script src="checkout.js"></script>

</body>
</html>
